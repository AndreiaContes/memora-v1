<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Enviar Fotos - Memora</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="premium-bg">
    <div class="menu-sidebar" id="menuSidebar">
      <div class="menu-header">
        <img src="img/memora.png" alt="Memora" class="menu-logo-img" />
        <button class="close-menu" id="closeMenuBtn">&times;</button>
      </div>

      <nav class="menu-nav-links">
        <a href="index.html">Início</a>
        <a href="album.html">Enviar Fotos</a>
        <a href="galeria.html">Galeria</a>
        <a href="telao.html">Telão</a>

        <a href="conta.html" class="admin-menu-link"> Entrar no aplicativo </a>
      </nav>
    </div>

    <div class="menu-overlay" id="menuOverlay"></div>

    <div class="phone-wrapper">
      <div class="app-card">
        <header class="header-actions-album">
          <a href="index.html" class="back-btn"></a>
          <button class="menu-button" id="openMenuBtn">
            <span></span><span></span><span></span>
          </button>
        </header>

        <section class="brand-container">
          <img src="img/memora.png" alt="Memora" class="brand-logo-img" />
          <p class="brand-subtitle">Memórias que Conectam</p>
        </section>

        <main class="album-upload-container">
          <h4 class="album-headline">Compartilhe seus melhores momentos</h4>

          <input
            type="file"
            id="cameraInput"
            accept="image/*"
            multiple
            hidden
          />

          <input
            type="file"
            id="cameraOnlyInput"
            accept="image/*"
            capture="environment"
            hidden
          />

          <div class="upload-zone" id="dropZone">
            <img
              src="img/camera-upload.svg.png"
              alt="upload"
              class="upload-icon"
            />
            <p>
              Adicione seus momentos<br />
              <small>Galeria ou câmera</small>
            </p>
            <small>JPG, PNG ou HEIC • Até 20MB por foto</small>

            <button id="btn-camera" class="camera-btn">
              <span class="camera-icon">📷</span>
              <span>Tirar foto</span>
            </button>
          </div>

          <div class="selected-header">
            <span>Selecionadas (0)</span>
            <button id="limparFotos" class="text-btn">Limpar</button>
          </div>

          <div id="previewGrid" class="preview-grid"></div>

          <button id="btn-enviar-fotos" class="btn-glow-primary">
            <span class="send-icon">➤</span> ENVIAR FOTOS
          </button>

          <div class="footer-note">
            <span class="star-icon">✦</span>
            <p>Suas fotos serão exibidas na galeria e no telão do evento.</p>
          </div>
        </main>
      </div>
    </div>

    <!-- 1. Carregar a biblioteca do Supabase primeiro -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="album.js"></script>
  </body>
</html>
