
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#171717">
  <title>Meu espaço | Memora</title>

  <style>
    :root {
      --dourado: #c6a15b;
      --preto: #171717;
      --texto: #292929;
      --borda: #e4ded4;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 24px;
      color: #f5f1e9;
      font-family: Arial, Helvetica, sans-serif;
      background-color: var(--preto);
      background-image:
        linear-gradient(rgba(15, 15, 15, 0.76), rgba(15, 15, 15, 0.88)),
        url("img/fundo-editar-album.png");
      background-position: center;
      background-size: cover;
      background-attachment: fixed;
    }

    .pagina {
      width: 100%;
      max-width: 1100px;
      margin: 0 auto;
    }

    .topo {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;
      margin-bottom: 36px;
      padding-bottom: 20px;
      border-bottom: 1px solid #c6a15b55;
    }

    .marca {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .marca img {
      width: 64px;
      height: 64px;
      object-fit: contain;
    }

    .marca h1 {
      margin: 0;
      color: var(--dourado);
      font-size: 28px;
      letter-spacing: 1px;
    }

    .marca p {
      margin: 5px 0 0;
      color: #d0c8bb;
      font-size: 13px;
    }

    button, a {
      font: inherit;
    }

    button, .botao {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 42px;
      padding: 11px 16px;
      border: 1px solid var(--dourado);
      border-radius: 8px;
      background: var(--dourado);
      color: var(--preto);
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;
      transition: background 0.2s, transform 0.2s;
    }

    button:hover, .botao:hover {
      background: #d7b875;
      transform: translateY(-1px);
    }

    .botao-secundario {
      background: transparent;
      color: #e4c783;
    }

    .botao-secundario:hover {
      background: #c6a15b1c;
    }

    .boas-vindas {
      margin-bottom: 30px;
    }

    .boas-vindas h2 {
      margin: 0 0 10px;
      font-size: clamp(25px, 4vw, 36px);
      color: #ffffff;
    }

    .boas-vindas p {
      max-width: 650px;
      margin: 0;
      color: #d0cbc3;
      line-height: 1.6;
    }

    .secao-titulo {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 18px;
    }

    .secao-titulo h3 {
      margin: 0;
      color: var(--dourado);
      font-size: 21px;
    }

    .eventos {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
    }

    .evento-card {
      display: flex;
      flex-direction: column;
      min-width: 0;
      padding: 22px;
      border: 1px solid #c6a15b55;
      border-radius: 16px;
      background: rgba(23, 23, 23, 0.94);
      box-shadow: 0 12px 35px #0003;
    }

    .evento-icone {
      display: grid;
      place-items: center;
      width: 48px;
      height: 48px;
      margin-bottom: 17px;
      border: 1px solid #c6a15b66;
      border-radius: 12px;
      color: var(--dourado);
      font-size: 24px;
    }

    .evento-card h4 {
      margin: 0 0 8px;
      color: #fff;
      font-size: 19px;
      overflow-wrap: anywhere;
    }

    .evento-card p {
      margin: 0 0 14px;
      color: #c9c3b9;
      font-size: 13px;
      line-height: 1.5;
    }

    .evento-status {
      align-self: flex-start;
      margin-bottom: 18px;
      padding: 5px 9px;
      border: 1px solid #c6a15b55;
      border-radius: 999px;
      color: #e4c783;
      font-size: 12px;
    }

    .evento-acoes {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin-top: auto;
    }

    .evento-acoes .botao {
      flex: 1;
      min-width: 115px;
      font-size: 13px;
      text-align: center;
    }

    .mensagem {
      padding: 18px;
      border: 1px solid #c6a15b55;
      border-radius: 12px;
      background: rgba(23, 23, 23, 0.94);
      color: #eee6d9;
      line-height: 1.6;
      overflow-wrap: anywhere;
    }

    .mensagem.erro {
      border-color: #bc655d;
      color: #ffd8d4;
    }

    .rodape {
      margin-top: 44px;
      padding: 20px 0;
      border-top: 1px solid #c6a15b44;
      color: #b8b0a4;
      font-size: 12px;
      text-align: center;
    }

    @media (max-width: 600px) {
      body {
        padding: 16px;
      }

      .topo {
        align-items: flex-start;
      }

      .marca img {
        width: 48px;
        height: 48px;
      }

      .marca h1 {
        font-size: 23px;
      }

      .marca p {
        max-width: 150px;
        line-height: 1.4;
      }

      .topo > button {
        padding: 9px 10px;
        font-size: 12px;
      }

      .eventos {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>
  <main class="pagina">
    <header class="topo">
      <div class="marca">
        <img src="img/memora.png" alt="Memora">
        <div>
          <h1>MEMORA</h1>
          <p>Seu espaço de memórias</p>
        </div>
      </div>

      <button id="botaoSair" class="botao-secundario" type="button">
        Sair da conta
      </button>
    </header>

    <section class="boas-vindas">
      <h2 id="tituloBoasVindas">Bem-vinda ao seu espaço</h2>
      <p>
        Aqui você poderá acessar as galerias dos seus eventos,
        criar seus álbuns digitais e continuar seus projetos salvos.
      </p>
    </section>

    <section aria-labelledby="tituloEventos">
      <div class="secao-titulo">
        <h3 id="tituloEventos">Meus eventos</h3>
      </div>

      <div id="mensagemDashboard" class="mensagem" role="status" aria-live="polite">
        Carregando seus eventos...
      </div>

      <div id="listaEventos" class="eventos" hidden></div>
    </section>

    <footer class="rodape">
      Memora — suas histórias merecem ser lembradas.
    </footer>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="dashboard.js"></script>
</body>
</html>
